name: Draft Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  draft-release:
    name: Create or Update Draft Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Detect semantic version bump
        id: bump
        run: |
          BUMP=$(node scripts/detect-bump.js --bump)
          NEXT_VERSION=$(node scripts/detect-bump.js --next-version)
          echo "bump=${BUMP}" >> "$GITHUB_OUTPUT"
          echo "next_version=${NEXT_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Generate release notes and update draft release
        if: steps.bump.outputs.bump != 'none' && steps.bump.outputs.next_version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT_VERSION: ${{ steps.bump.outputs.next_version }}
        run: |
          ./scripts/generate-release-notes.sh --tag "$NEXT_VERSION" > release-notes.md
          if IS_DRAFT=$(gh release view "$NEXT_VERSION" --json isDraft -q .isDraft 2>/dev/null); then
            if [ "$IS_DRAFT" = "true" ]; then
              gh release edit "$NEXT_VERSION" \
                --notes-file release-notes.md \
                --target "$GITHUB_SHA"
            else
              echo "Release $NEXT_VERSION already exists and is published; skipping."
            fi
          else
            gh release create "$NEXT_VERSION" \
              --draft \
              --title "$NEXT_VERSION" \
              --notes-file release-notes.md \
              --target "$GITHUB_SHA"
          fi
