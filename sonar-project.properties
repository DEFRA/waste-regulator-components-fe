# To set up Sonar cloud follow https://github.com/DEFRA/cdp-documentation/blob/main/howto/sonarcloud.md
# Update properties in this file as per the howto instructions

sonar.projectKey=DEFRA_waste-regulator-components-fe
sonar.organization=defra

sonar.links.homepage=https://github.com/DEFRA/waste-regulator-components-fe
sonar.links.ci=https://github.com/DEFRA/waste-regulator-components-fe/actions
sonar.links.scm=https://github.com/DEFRA/waste-regulator-components-fe
sonar.links.issue=https://github.com/DEFRA/waste-regulator-components-fe/issues

sonar.sources=dist,scripts
sonar.exclusions=dist/wrc/assets/**,**/*.test.js,docs/assets/css/**,examples/src/public/**
sonar.tests=tests,examples/test
sonar.test.inclusions=tests/**/*.test.js,examples/test/**/*.test.js

sonar.javascript.lcov.reportPaths=./coverage/lcov.info

sonar.cpd.exclusions=tests/**,examples/**
